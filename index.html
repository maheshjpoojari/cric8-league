<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cric-8 League & Quick Match</title>
    <!-- Firebase Compat Scripts (Synchronous & Zero-Freeze) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root { --bg: #0b1120; --card: #111827; --blue: #38bdf8; --gold: #fbbf24; --red: #ef4444; --green: #22c55e; --purple: #a855f7; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; padding: 12px; }
        .hidden { display: none !important; }
        
        .app-view { max-width: 480px; margin: 0 auto; }
        .view-card { background: var(--card); border: 1px solid #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        
        .top-bar { background: #0284c7; color: white; font-size: 0.75rem; font-weight: bold; padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .view-title { color: var(--blue); margin-top: 0; font-size: 1.25rem; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; font-weight: bold; }
        .input-field { width: 100%; box-sizing: border-box; background: #0b1120; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; font-size: 0.95rem; }
        select:disabled { background: #1e293b; color: #64748b; border-color: #334155; opacity: 1; -webkit-appearance: none; appearance: none; }

        .btn { border: none; background: #1e293b; color: #fff; padding: 14px 0; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; }
        .btn-blue { background: #0ea5e9; } .btn-orange { background: #f97316; } .btn-red { background: var(--red); }
        .btn-green { background: var(--green); } .btn-purple { background: var(--purple); } .btn-util { background: #334155; font-size: 0.75rem; padding: 10px; }

        .coin-wrapper { perspective: 800px; display: flex; justify-content: center; margin: 15px 0; }
        .coin { width: 80px; height: 80px; position: relative; transform-style: preserve-3d; transition: transform 2s ease-out; }
        .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; backface-visibility: hidden; border: 3px solid #f59e0b; box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }
        .heads { background: radial-gradient(circle, #fde047, #d97706); color: #78350f; }
        .tails { background: radial-gradient(circle, #fde047, #b45309); color: #78350f; transform: rotateY(180deg); }
        .animate-heads { transform: rotateY(1800deg); }
        .animate-tails { transform: rotateY(1980deg); }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; padding: 6px 4px; color: var(--blue); font-weight: bold; font-size: 0.82rem; }
        .pair-badge { background: #1e293b; color: var(--gold); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; border: 1px solid #334155; }
        .player-bar { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-radius: 12px 12px 0 0; margin-top: 5px; border: 1px solid #1e293b; }
        .bat-card { padding: 15px 5px; text-align: center; font-weight: bold; color: #64748b; border-bottom: 3px solid transparent; cursor: pointer; }
        .striker-active { color: var(--gold); border-bottom-color: var(--gold); }
        .score-card { background: var(--card); border: 1px solid #1e293b; border-radius: 0 0 15px 15px; padding: 25px 10px; text-align: center; margin-bottom: 15px; }
        .main-score { font-size: 5.5rem; font-weight: 900; color: var(--blue); margin: 0; line-height: 1; transition: color 0.2s ease; }
        .ball-row { display: flex; justify-content: center; gap: 6px; margin-top: 15px; flex-wrap: wrap; min-height: 35px; }
        .ball { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 800; font-size: 0.7rem; }
        .bg-white { background: #fff; } .bg-red { background: var(--red); color: #fff; } .bg-yellow { background: var(--gold); }
        
        .next-over-btn { color: var(--gold); font-weight: bold; margin-top: 15px; cursor: pointer; animation: blink 1s infinite; text-decoration: underline; }
        @keyframes blink { 50% { opacity: 0.3; } }
        
        .admin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .emergency-tools { grid-column: span 4; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 15px; overflow-y: auto; }

        .sc-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        .sc-table th, .sc-table td { padding: 6px; text-align: left; border-bottom: 1px solid #1e293b; }
        .sc-table th { color: var(--blue); }
        .tab-btn { background: #1e293b; border: none; color: #94a3b8; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .tab-btn.active { background: #0ea5e9; color: white; }

        .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; max-height: 200px; overflow-y: auto; padding: 4px; background: #0b1120; border-radius: 8px; border: 1px solid #1e293b; }
        .player-chip { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; background: #1e293b; color: #94a3b8; border: 1px solid #334155; cursor: pointer; user-select: none; }
        .player-chip.selected { background: rgba(34, 197, 94, 0.2); color: var(--green); border-color: var(--green); }
        .player-chip.impact { background: rgba(168, 85, 247, 0.2); color: var(--purple); border-color: var(--purple); }

        .repeat-badge { background: rgba(251, 191, 36, 0.2); color: var(--gold); border: 1px solid var(--gold); font-size: 0.65rem; padding: 1px 4px; border-radius: 4px; margin-left: 4px; font-weight: bold; }
        .bowler-badge { background: rgba(56, 189, 248, 0.2); color: var(--blue); border: 1px solid var(--blue); font-size: 0.65rem; padding: 1px 4px; border-radius: 4px; margin-left: 4px; font-weight: bold; }

        .fixture-card { background: #0b1120; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .fixture-teams { font-weight: bold; font-size: 0.9rem; }
        .fixture-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="top-bar app-view">
        <span id="roleIndicator">MATCH CONSOLE</span>
        <span id="activeSlotTag" style="background:#0f172a; padding:2px 8px; border-radius:4px; color:var(--gold);">PITCH 1</span>
    </div>

    <!-- VIEW 1: HOME HUB -->
    <div id="viewHome" class="app-view">
        <div class="view-card" style="text-align: center;">
            <h2 class="view-title" style="margin-bottom:8px;">🏏 CRIC-8 ARENA</h2>
            <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:20px;">Host a match directly, manage fixtures, or view standings</p>

            <button class="btn btn-green" style="width:100%; margin-bottom:12px;" onclick="window.startHostFlow()">⚡ SCORE A QUICK MATCH (HOST)</button>
            <button class="btn btn-blue" style="width:100%; margin-bottom:12px;" onclick="window.openFixturesView()">📅 FIXTURES & TOURNAMENT HUB</button>
            <button class="btn btn-purple" style="width:100%; margin-bottom:12px;" onclick="window.openStandingsView()">📊 VIEW STANDINGS & LEADERBOARD</button>
            <button class="btn" style="width:100%; background:#334155; font-size:0.85rem;" onclick="window.enterAsGuest()">SPECTATOR / LIVE MATCH VIEW</button>
        </div>
    </div>

    <!-- VIEW 2: TOURNAMENT LOGIN -->
    <div id="viewLogin" class="app-view hidden">
        <div class="view-card">
            <h2 class="view-title">🏆 TOURNAMENT OFFICIAL LOGIN</h2>
            <div class="input-group">
                <label>Referee Email</label>
                <input type="email" id="loginEmail" class="input-field" placeholder="referee@league.com">
            </div>
            <div class="input-group">
                <label>PIN / Password</label>
                <input type="password" id="loginPass" class="input-field" placeholder="••••••••">
            </div>
            <button class="btn btn-blue" style="width:100%; margin-bottom: 10px;" onclick="window.handleLogin()">VERIFY & PROCEED</button>
            <button class="btn" style="width:100%; background:#334155; font-size:0.8rem;" onclick="window.navigateView('viewHome')">CANCEL</button>
        </div>
    </div>

    <!-- VIEW 3: TOURNAMENT FIXTURES HUB -->
    <div id="viewFixtures" class="app-view hidden">
        <div class="view-card">
            <h2 class="view-title">📅 TOURNAMENT FIXTURES</h2>
            <div class="input-group">
                <label>Select Tournament</label>
                <select id="fixtureTourneyFilter" class="input-field" onchange="window.loadFixturesList()">
                    <option value="corporate">Corporate Pairs Championship</option>
                    <option value="premier">Dubai Premier League</option>
                    <option value="friendly">Friendly / Exhibition</option>
                </select>
            </div>
            <div style="display:flex; gap:8px; margin-bottom:15px;">
                <button class="btn btn-blue" style="flex:1; padding:10px; font-size:0.8rem;" onclick="window.autoGenerateRoundRobinFixtures()">⚡ Auto-Generate</button>
                <button class="btn btn-green" style="flex:1; padding:10px; font-size:0.8rem;" onclick="window.navigateView('viewTournament')">+ New Match</button>
            </div>
            <div id="fixturesListContainer">
                <div style="text-align:center; padding:20px; color:#64748b;">Loading schedule...</div>
            </div>
            <button class="btn" style="width:100%; margin-top:15px; background:#334155; font-size:0.85rem;" onclick="window.navigateView('viewHome')">BACK TO HOME</button>
        </div>
    </div>

    <!-- VIEW 4: TOURNAMENT STANDINGS & LEADERBOARD -->
    <div id="viewStandings" class="app-view hidden">
        <div class="view-card">
            <h2 class="view-title">🏆 STANDINGS & LEADERBOARDS</h2>
            <div class="input-group">
                <label>Filter By Tournament</label>
                <select id="standingsTourneyFilter" class="input-field" onchange="window.loadTournamentStandings()">
                    <option value="all">All Tournaments</option>
                    <option value="corporate">Corporate Pairs Championship</option>
                    <option value="premier">Dubai Premier League</option>
                    <option value="friendly">Friendly / Exhibition</option>
                </select>
            </div>
            <div style="display: flex; gap: 6px; margin-bottom: 15px; justify-content: center;">
                <button class="tab-btn active" id="tabPointsBtn" onclick="window.switchStandingsTab('points')">Points</button>
                <button class="tab-btn" id="tabOrangeBtn" onclick="window.switchStandingsTab('orange')">Orange Cap</button>
                <button class="tab-btn" id="tabPurpleBtn" onclick="window.switchStandingsTab('purple')">Purple Cap</button>
                <button class="tab-btn" id="tabGloveBtn" onclick="window.switchStandingsTab('glove')">Fielding</button>
            </div>
            <div id="standingsTabContent">
                <div style="text-align:center; padding:20px; color:#64748b;">Loading records...</div>
            </div>
            <button class="btn" style="width:100%; margin-top:15px; background:#334155; font-size:0.85rem;" onclick="window.navigateView('viewHome')">BACK TO HOME</button>
        </div>
    </div>

    <!-- VIEW 5: FIXTURE SETUP -->
    <div id="viewTournament" class="app-view hidden">
        <div class="view-card">
            <h2 class="view-title" id="setupTitle">⚙️ MATCH SETUP</h2>
            
            <div class="input-group">
                <label>Match Pitch / Slot</label>
                <select id="matchSlotSelect" class="input-field" onchange="window.switchMatchSlot()">
                    <option value="pitch_1">Pitch 1</option>
                    <option value="pitch_2">Pitch 2</option>
                    <option value="pitch_3">Pitch 3</option>
                    <option value="pitch_4">Pitch 4</option>
                    <option value="custom_slot">Custom Match ID...</option>
                </select>
            </div>

            <div class="input-group hidden" id="customSlotGroup">
                <label>Custom Match ID</label>
                <input type="text" id="customSlotInput" class="input-field" placeholder="e.g., friday_night_cup">
            </div>

            <div class="input-group" style="background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #334155;">
                <label style="color: var(--gold);">⚡ SCORING RULES FORMAT</label>
                <select id="rulesFormatSelect" class="input-field">
                    <option value="pairs">Custom Cric-8 Pairs (All 8 Overs Played, -5 Penalty)</option>
                    <option value="classic">Classic Standard Cricket (Chased = Match Ends, Standard Dismissal)</option>
                </select>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-group">
                    <label>Match Total Overs</label>
                    <input type="number" id="matchOversInput" class="input-field" value="8" min="2" max="50">
                </div>
                <div class="input-group">
                    <label style="color: var(--gold);">Players Per Team</label>
                    <input type="number" id="playersPerTeamInput" class="input-field" value="8" min="2" max="11">
                </div>
            </div>

            <div class="input-group">
                <label>Tournament / Context</label>
                <select id="tourneySelect" class="input-field">
                    <option value="corporate">Corporate Pairs Championship</option>
                    <option value="premier">Dubai Premier League</option>
                    <option value="friendly">Friendly / Exhibition Match</option>
                </select>
            </div>

            <div class="input-group">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <label style="margin-bottom:0;">Team 1 (Calls HEADS)</label>
                    <button class="btn btn-util" style="padding:4px 8px; font-size:0.7rem;" onclick="window.openSquadEditor('selectTeam1')">👥 Select Playing Squad</button>
                </div>
                <select id="selectTeam1" class="input-field" onchange="window.onTeamSelectChange('selectTeam1')"></select>
            </div>
            
            <div class="input-group">
                <div style
