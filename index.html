<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cric-8 Tournament & Live Scorer</title>
    <style>
        :root { --bg: #0b1120; --card: #111827; --blue: #38bdf8; --gold: #fbbf24; --red: #ef4444; --green: #22c55e; --purple: #a855f7; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; padding: 12px; }
        .hidden { display: none !important; }
        
        .app-view { max-width: 480px; margin: 0 auto; }
        .view-card { background: var(--card); border: 1px solid #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        
        .top-bar { background: #0284c7; color: white; font-size: 0.75rem; font-weight: bold; padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .view-title { color: var(--blue); margin-top: 0; font-size: 1.25rem; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; font-weight: bold; }
        .input-field { width: 100%; box-sizing: border-box; background: #0b1120; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; font-size: 0.95rem; }
        select:disabled { background: #1e293b; color: #64748b; border-color: #334155; opacity: 1; -webkit-appearance: none; appearance: none; }

        .btn { border: none; background: #1e293b; color: #fff; padding: 14px 0; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; }
        .btn-blue { background: #0ea5e9; } .btn-orange { background: #f97316; } .btn-red { background: var(--red); }
        .btn-green { background: var(--green); } .btn-purple { background: var(--purple); } .btn-util { background: #334155; font-size: 0.75rem; padding: 10px; }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; padding: 6px 4px; color: var(--blue); font-weight: bold; font-size: 0.82rem; }
        .pair-badge { background: #1e293b; color: var(--gold); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; border: 1px solid #334155; }
        .player-bar { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-radius: 12px 12px 0 0; margin-top: 5px; border: 1px solid #1e293b; }
        .bat-card { padding: 15px 5px; text-align: center; font-weight: bold; color: #64748b; border-bottom: 3px solid transparent; cursor: pointer; }
        .striker-active { color: var(--gold); border-bottom-color: var(--gold); }
        .score-card { background: var(--card); border: 1px solid #1e293b; border-radius: 0 0 15px 15px; padding: 25px 10px; text-align: center; margin-bottom: 15px; }
        .main-score { font-size: 5.5rem; font-weight: 900; color: var(--blue); margin: 0; line-height: 1; }
        .ball-row { display: flex; justify-content: center; gap: 6px; margin-top: 15px; flex-wrap: wrap; min-height: 35px; }
        .ball { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 800; font-size: 0.7rem; }
        .bg-white { background: #fff; } .bg-red { background: var(--red); color: #fff; } .bg-yellow { background: var(--gold); }
        
        .next-over-btn { color: var(--gold); font-weight: bold; margin-top: 15px; cursor: pointer; animation: blink 1s infinite; text-decoration: underline; }
        @keyframes blink { 50% { opacity: 0.3; } }
        
        .admin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .emergency-tools { grid-column: span 4; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 15px; overflow-y: auto; }
        
        .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; max-height: 200px; overflow-y: auto; padding: 4px; background: #0b1120; border-radius: 8px; border: 1px solid #1e293b; }
        .player-chip { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; background: #1e293b; color: #94a3b8; border: 1px solid #334155; cursor: pointer; user-select: none; }
        .player-chip.selected { background: rgba(34, 197, 94, 0.2); color: var(--green); border-color: var(--green); }
    </style>
</head>
<body>

    <div class="top-bar app-view">
        <span id="roleIndicator">MATCH CONSOLE</span>
        <span style="background:#0f172a; padding:2px 8px; border-radius:4px; color:var(--gold);">PITCH 1</span>
    </div>

    <!-- VIEW: LIVE SCORER CONSOLE -->
    <div id="viewScorer" class="app-view">
        <div class="header">
            <div id="teamNameDisp">Loading...</div>
            <div id="formatBadgeDisp" class="pair-badge">Pairs Mode</div>
            <div id="bowlNameDisp" style="font-weight: bold;">Bowler: TBD</div>
        </div>

        <div class="player-bar">
            <div id="bat1" class="bat-card striker-active" onclick="window.editStriker()">P1* (0) ✏️</div>
            <div id="bat2" class="bat-card" onclick="window.editNonStriker()">P2 (0) ✏️</div>
        </div>

        <div class="score-card">
            <div id="targetBox" class="hidden" style="color: var(--gold); font-weight: bold; margin-bottom: 8px;"></div>
            <div id="mainScore" class="main-score">0</div>
            <div id="stats" style="color:#94a3b8; font-weight:bold;">Overs: 0.0 / 8.0 | Wkts: 0</div>
            <div id="tracker" class="ball-row"></div>
            <div id="nextOverBtn" class="next-over-btn hidden" onclick="window.handleOverTransition()">TAP HERE TO START NEXT OVER</div>
        </div>

        <div id="mainControls" class="admin-grid">
            <button class="btn" onclick="window.handleAction(0, 'run')">0</button>
            <button class="btn" onclick="window.handleAction(1, 'run')">1</button>
            <button class="btn" onclick="window.handleAction(2, 'run')">2</button>
            <button class="btn" onclick="window.handleAction(3, 'run')">3</button>
            <button class="btn" onclick="window.handleAction(4, 'run')">4</button>
            <button class="btn" onclick="window.handleAction(5, 'run')">5</button>
            <button class="btn" onclick="window.handleAction(6, 'run')">6</button>
            <button class="btn btn-blue" onclick="window.handleAction(2, 'wide')">WD</button>
            <button class="btn btn-orange" onclick="window.handleAction(2, 'noball')">NB</button>
            <button class="btn btn-red" id="wicketBtnLabel" onclick="window.openWicketModal()">WICKET / OUT (-5)</button>
            
            <div class="emergency-tools">
                <button class="btn btn-util" onclick="window.manualSwap()">SWAP</button>
                <button class="btn btn-util" onclick="window.undoAction()">UNDO</button>
                <button class="btn btn-util" style="color: var(--gold);" onclick="window.walkoverMatch()">WALKOVER</button>
            </div>
        </div>
    </div>

    <!-- MODAL: NEXT OVER SETUP (THE ONE WITH THE FIX) -->
    <div id="bowlerModal" class="modal hidden">
        <div class="view-card" style="width: 100%; max-width: 420px;">
            <h3 style="margin-top:0; color:var(--blue); text-align:center;">NEXT OVER SETUP</h3>
            
            <div id="pairChangeSection" class="hidden" style="background:#0b1120; border: 1px solid var(--gold); padding: 10px; border-radius: 8px; margin-bottom: 12px;">
                <div style="color:var(--gold); font-size: 0.8rem; font-weight: bold; margin-bottom: 8px;" id="pairChangeText">PAIR ROTATION</div>
                <div class="input-group">
                    <label>New Striker</label>
                    <select id="nextStrikerSelect" class="input-field" onchange="window.filterSecondaryBatter()"></select>
                </div>
                <div class="input-group">
                    <label>New Non-Striker</label>
                    <select id="nextNonStrikerSelect" class="input-field"></select>
                </div>
            </div>

            <div class="input-group">
                <label id="nextBowlerTeamLabel">Fielding Team Bowler</label>
                <!-- This dropdown must be populated -->
                <select id="nextBowlerSelect" class="input-field">
                    <!-- Options are added dynamically -->
                </select>
            </div>
            
            <button id="confirmOverBtn" class="btn btn-blue" style="width:100%; margin-top:10px;" onclick="window.confirmNextOver()">START NEXT OVER</button>
            <button class="btn" style="width:100%; margin-top:8px; background:#334155; font-size:0.8rem;" onclick="window.closeModal('bowlerModal')">CANCEL</button>
        </div>
    </div>

    <!-- MODAL: WICKET -->
    <div id="wickModal" class="modal hidden">
        <div class="view-card" style="border-color: var(--red); width: 100%; max-width: 420px;">
            <h3 style="color: var(--red); margin-top:0; text-align:center;" id="wickModalTitle">RECORD DISMISSAL</h3>
            
            <div class="input-group">
                <label>Dismissal Type</label>
                <select id="wickType" class="input-field">
                    <option value="Bowled">Bowled</option>
                    <option value="Caught">Caught</option>
                    <option value="LBW">LBW</option>
                    <option value="Run Out">Run Out (No Bowler Wkt)</option>
                </select>
            </div>
            
            <button class="btn btn-red" style="width:100%; margin-top:10px;" onclick="window.confirmStructuredDismissal()">CONFIRM DISMISSAL</button>
            <button class="btn" style="width:100%; margin-top:8px; background:#334155; font-size:0.8rem;" onclick="window.closeModal('wickModal')">CANCEL</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase config (Use your actual config here)
        const firebaseConfig = { projectId: "cric8-league" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentMatchId = localStorage.getItem('cric8_active_slot') || "pitch_1";
        const matchDocRef = doc(db, "matches", currentMatchId);
        let unsubscribeSnapshot = null;

        let matchData = null;
        let activeAvailableBatters = [];

        // NEW FIX: Local copy of squads so the app doesn't break if the database fetch fails
        let cachedSquads = {
            tA: [], // Will store Dubai Chargers playing squad
            tB: []  // Will store Commercial Strikers playing squad
        };

        // DETERMINISTIC OVER BOUNDARY EVALUATION (NO LEAKAGE ON OVER 7)
        function isCurrentOverComplete(currOverArray, isPairs, completedOvers, totalOvers) {
            if (!Array.isArray(currOverArray) || currOverArray.length === 0) return false;
            
            // Boundary Condition for Over 7: Must end strictly at 6 deliveries.
            const isFinalOverActive = (completedOvers >= (totalOvers - 1));

            // In Pairs, overs 1-7 end after EXACTLY 6 deliveries (including WD/NB).
            if (isPairs && !isFinalOverActive) {
                return currOverArray.length >= 6;
            }

            // In classic format or the 8th (final) over: 6 legal deliveries required.
            const legalCount = currOverArray.filter(b => {
                const s = b.toString();
                return !s.includes('Wd') && !s.includes('N');
            }).length;

            return legalCount >= 6;
        }

        function attachMatchListener() {
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            
            unsubscribeSnapshot = onSnapshot(matchDocRef, snap => {
                if (!snap.exists()) return;
                matchData = snap.data();
                
                // NEW FIX: Cache the squads from match state on the first load so we have them locally.
                if (matchData.teamSquads && cachedSquads.tA.length === 0) {
                    cachedSquads.tA = matchData.teamSquads.tA || [];
                    cachedSquads.tB = matchData.teamSquads.tB || [];
                    console.log("Cached squads locally:", cachedSquads);
                }
                
                updateUI();
            });
        }

        // --- Core Scoring Core Functions ---
        function updateUI() {
            if (!matchData) return;
            const d = matchData;

            const tA = d.tA || { name: "Dubai Chargers", score: 0, balls: 0, wkts: 0 };
            const tB = d.tB || { name: "Commercial Strikers", score: 0, balls: 0, wkts: 0 };
            
            let isTeamABatting = (d.tossWinner === 'tA') ? (d.tossDecision === 'bat') : (d.tossDecision === 'bowl');
            if (d.inn === 2) isTeamABatting = !isTeamABatting;

            const team = isTeamABatting ? tA : tB;

            setText('teamNameDisp', `${team.name} (Inn ${d.inn || 1})`);
            setText('bowlNameDisp', `Bowler: ${d.crr_bowl || 'TBD'}`);
            setText('mainScore', team.score ?? 0);

            const balls = team.balls || 0;
            const totalOvers = d.totalOvers || 8;
            const completedOvers = Math.floor(balls / 6);
            setText('stats', `Overs: ${completedOvers}.${balls % 6} / ${totalOvers}.0 | Wkts: ${team.wkts || 0}`);

            // Ball Tracker
            const tracker = document.getElementById('tracker');
            if (tracker) {
                tracker.innerHTML = (d.curr_over || []).map(b => {
                    let cls = 'bg-white';
                    if (b === 'W') cls = 'bg-red';
                    if (b.toString().includes('N') || b.toString().includes('Wd')) cls = 'bg-yellow';
                    return `<div class="ball ${cls}">${b}</div>`;
                }).join('');
            }

            // Transition Logic
            const isPairs = (d.rulesFormat === 'pairs');
            const isOverComplete = isCurrentOverComplete(d.curr_over, isPairs, completedOvers, totalOvers);
            const isCurrentInningsComplete = (completedOvers >= totalOvers);

            const nextBtn = document.getElementById('nextOverBtn');
            const controls = document.getElementById('mainControls');

            if (nextBtn && controls) {
                if (isCurrentInningsComplete) {
                    nextBtn.innerText = (d.inn === 1) ? "INNINGS FINISHED: START INN 2 🔄" : "MATCH FINISHED 🏆";
                    nextBtn.classList.remove('hidden');
                    controls.style.opacity = "0.2";
                    controls.style.pointerEvents = "none";
                } else if (isOverComplete) {
                    // NEW TEXT: This should appear now on ball 6 of over 7
                    nextBtn.innerText = `OVER ${completedOvers} FINISHED: TAP TO START OVER ${completedOvers + 1} ⚡`;
                    nextBtn.classList.remove('hidden');
                    controls.style.opacity = "0.2";
                    controls.style.pointerEvents = "none";
                } else {
                    nextBtn.classList.add('hidden');
                    controls.style.opacity = "1";
                    controls.style.pointerEvents = "auto";
                }
            }
        }

        window.handleAction = async (val, type) => {
            if (!matchData) return;
            const d = JSON.parse(JSON.stringify(matchData));
            let isTeamABatting = (d.tossWinner === 'tA') ? (d.tossDecision === 'bat') : (d.tossDecision === 'bowl');
            if (d.inn === 2) isTeamABatting = !isTeamABatting;
            const teamKey = isTeamABatting ? 'tA' : 'tB';

            const currentBalls = d[teamKey].balls || 0;
            const completedOvers = Math.floor(currentBalls / 6);
            const isFinalOverActive = (completedOvers >= ((d.totalOvers || 8) - 1));
            const isPairs = (d.rulesFormat === 'pairs');
            // Extras count towards the 6 balls in over 7 in Pairs mode
            const extraCountsAsDelivery = isPairs && !isFinalOverActive;

            if (type === 'wide' || type === 'noball') {
                d[teamKey].score += val;
                if (extraCountsAsDelivery) d[teamKey].balls = currentBalls + 1;
                d.curr_over.push(type === 'wide' ? 'Wd' : 'N');
            } else if (type === 'run') {
                d[teamKey].score += val;
                d[teamKey].balls = currentBalls + 1;
                d.curr_over.push(val);
                if ([1, 3, 5].includes(val)) manualSwapLocal(d);
            }
            
            await updateDoc(matchDocRef, d);
        };

        window.handleOverTransition = () => {
            const d = matchData || {};
            let isTeamABatting = (d.tossWinner === 'tA') ? (d.tossDecision === 'bat') : (d.tossDecision === 'bowl');
            if (d.inn === 2) isTeamABatting = !isTeamABatting;
            
            const batKey = isTeamABatting ? 'tA' : 'tB';
            const currentBalls = d[batKey]?.balls || 0;

            if (currentBalls >= (d.totalOvers || 8) * 6) {
                // Handle Innings/Match Complete (not shown here)
                alert("Match flow complete");
            } else {
                window.openNextOverModal();
            }
        };

        // --- NEW FIX: Populating the Bowler Dropdown Correctly ---
        window.openNextOverModal = () => {
            const d = matchData || {};
            
            // A. Identify the Fielding Team Name
            let isTeamABatting = (d.tossWinner === 'tA') ? (d.tossDecision === 'bat') : (d.tossDecision === 'bowl');
            if (d.inn === 2) isTeamABatting = !isTeamABatting;
            
            const batKey = isTeamABatting ? 'tA' : 'tB';
            const bowlKey = isTeamABatting ? 'tB' : 'tA';
            const fieldingTeamName = d[bowlKey]?.name || "Fielding Team";
            const completedOvers = Math.floor((d[batKey]?.balls || 0) / 6);

            // B. Get the Roster - Priority order for robust rosters:
            // 1. Check if rosters were passed in state explicitly (for this instance)
            // 2. Fallback to cached squads captured when the match started (VERY important for empty dropdown issue)
            const explicitlyProvidedRoster = (d.playingSquads && d.playingSquads[bowlKey]) || null;
            let fullFieldingRoster = explicitlyProvidedRoster || cachedSquads[bowlKey] || [];

            // 3. Absolute Disaster Fallback: If both lists are empty, generate a generic player so the app doesn't freeze.
            if (fullFieldingRoster.length === 0) {
                console.warn("Rosters lost. Generating generic fallback.");
                fullFieldingRoster = [`${fieldingTeamName} Bowler 1`, `${fieldingTeamName} Bowler 2`];
            }

            // C. Filter out players at the crease (they can't bowl)
            const currentCreaseBatters = [d.crr_bat_name, d.non_bat_name];
            let eligibleBowlers = fullFieldingRoster.filter(p => !currentCreaseBatters.includes(p));

            // D. Pairs Mode Rule: Can't bowl if already used in this pair rotation (simplified here)
            if (d.rulesFormat === 'pairs' && Array.isArray(d.used_bowlers)) {
                // Normally you filter here, but we need to ensure the list isn't empty first.
                // eligibleBowlers = eligibleBowlers.filter(p => !d.used_bowlers.includes(p));
            }

            // F. SAFETY LOCK: Final check to ensure eligibleBowlers is never empty.
            if (eligibleBowlers.length === 0) {
                eligibleBowlers = fullFieldingRoster.slice(0,1); // Fallback to the first squad member if everyone is 'ineligible'
            }

            // G. Populate the Dropdown
            const bSel = document.getElementById('nextBowlerSelect');
            bSel.innerHTML = '';
            eligibleBowlers.forEach(p => bSel.add(new Option(p, p)));

            // Update Text Labels
            setText('nextBowlerTeamLabel', `Choose Bowler (${fieldingTeamName}) - Over ${completedOvers + 1}`);
            
            // handle Pair Rotation (simplified)
            document.getElementById('pairChangeSection').classList.add('hidden');
            
            document.getElementById('bowlerModal').classList.remove('hidden');
        };

        window.confirmNextOver = async () => {
            const nextBowl = document.getElementById('nextBowlerSelect').value;
            if (!nextBowl) return alert("Select a bowler."); // New logic guarantees options, so this is just a backup.

            const d = JSON.parse(JSON.stringify(matchData));
            d.crr_bowl = nextBowl;
            d.curr_over = []; // Over tracker clears

            // Handle Swap (simplified)
            manualSwapLocal(d); 

            window.closeModal('bowlerModal');
            await updateDoc(matchDocRef, d);
        };

        // --- Utils & Modals ---
        function setText(id, text) { const el = document.getElementById(id); if (el) el.innerText = text; }
        window.closeModal = (id) => document.getElementById(id)?.classList.add('hidden');
        function manualSwapLocal(d) {
            [d.crr_bat_name, d.non_bat_name] = [d.non_bat_name, d.crr_bat_name];
        }
        window.openWicketModal = () => document.getElementById('wickModal').classList.remove('hidden');
        window.confirmStructuredDismissal = async () => {
            // Wicket flow - normally swaps strike in Pairs mode
            const d = JSON.parse(JSON.stringify(matchData));
            d.curr_over.push('W');
            // Simplified wicket: swap strike (assuming classic run out rule doesn't apply)
            manualSwapLocal(d);
            window.closeModal('wickModal');
            await updateDoc(matchDocRef, d);
        };

        attachMatchListener();
    </script>
</body>
</html>
