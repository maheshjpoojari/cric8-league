<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cric-8 Live Match Center</title>
    <!-- Firebase Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root { --bg: #0b1120; --card: #111827; --blue: #38bdf8; --gold: #fbbf24; --red: #ef4444; --green: #22c55e; --purple: #a855f7; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; }
        .hidden { display: none !important; }
        .app-view { max-width: 480px; margin: 0 auto; }
        .view-card { background: var(--card); border: 1px solid #1e293b; border-radius: 12px; padding: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); margin-bottom: 12px; }
        
        .top-bar { background: #0284c7; color: white; font-size: 0.75rem; font-weight: bold; padding: 6px 10px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .view-title { color: var(--blue); margin-top: 0; font-size: 1.15rem; text-align: center; margin-bottom: 14px; }
        
        /* BROADCAST NAV TABS (Cricbuzz Style) */
        .broadcast-nav { display: flex; background: #0f172a; border-radius: 8px; overflow-x: auto; padding: 4px; margin-bottom: 12px; border: 1px solid #1e293b; }
        .b-tab { background: transparent; border: none; color: #94a3b8; padding: 8px 12px; font-size: 0.78rem; font-weight: bold; cursor: pointer; white-space: nowrap; border-radius: 6px; }
        .b-tab.active { background: #0284c7; color: white; }

        .btn { border: none; background: #1e293b; color: #fff; padding: 12px 0; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; text-align: center; width: 100%; margin-bottom: 8px; }
        .btn-blue { background: #0ea5e9; } .btn-green { background: var(--green); } .btn-orange { background: #f97316; } .btn-purple { background: var(--purple); }

        .sc-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 8px; }
        .sc-table th, .sc-table td { padding: 6px; text-align: left; border-bottom: 1px solid #1e293b; }
        .sc-table th { color: var(--blue); }

        .match-hub-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s; }
        .match-hub-card:hover { border-color: var(--blue); }
        .ball-pill { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; background: #334155; color: white; margin-right: 4px; }
        .ball-pill.four { background: var(--blue); color: #000; }
        .ball-pill.six { background: var(--green); color: #000; }
        .ball-pill.wkt { background: var(--red); color: white; }
    </style>
</head>
<body>

    <div class="top-bar app-view">
        <span id="roleIndicator">CRIC-8 BROADCAST CENTER</span>
        <span id="activeSlotTag" style="background:#0f172a; padding:2px 8px; border-radius:4px; color:var(--gold);">HUB</span>
    </div>

    <!-- VIEW 1: HOME HUB -->
    <div id="viewHome" class="app-view">
        <div class="view-card" style="text-align: center;">
            <h2 class="view-title" style="margin-bottom:6px;">🏏 CRIC-8 ARENA</h2>
            <p style="font-size:0.8rem; color:#94a3b8; margin-bottom:16px;">Scan QR code or select view below</p>

            <button class="btn btn-blue" onclick="window.openLiveHubView()">🔴 LIVE MATCHES (SPECTATOR HUB)</button>
            <button class="btn btn-green" onclick="window.startHostFlow()">⚡ HOST / SCORE A MATCH</button>
            <button class="btn btn-purple" onclick="window.openStandingsView()">📊 TOURNAMENT STANDINGS</button>
            <button class="btn btn-orange" onclick="window.openHistoryView()">📜 MATCH ARCHIVE</button>
        </div>
    </div>

    <!-- VIEW 2: SPECTATOR LIVE MATCHES HUB (Cricbuzz style card list) -->
    <div id="viewLiveHub" class="app-view hidden">
        <div class="view-card">
            <h2 class="view-title">🔴 CURRENTLY LIVE MATCHES</h2>
            <div class="input-group" style="margin-bottom:12px;">
                <label style="font-size:0.75rem; color:#94a3b8;">Filter by Tournament</label>
                <select id="hubTourneyFilter" class="input-field" style="width:100%; padding:10px; background:#0b1120; border:1px solid #334155; color:white; border-radius:6px;" onchange="window.renderLiveHubMatches()">
                    <option value="all">All Tournaments</option>
                    <option value="corporate">Corporate Pairs Championship</option>
                    <option value="premier">Dubai Premier League</option>
                    <option value="friendly">Friendly / Exhibition</option>
                </select>
            </div>
            <div id="liveHubContainer">
                <div style="text-align:center; padding:20px; color:#64748b;">Scanning active pitches...</div>
            </div>
            <button class="btn" style="background:#334155; margin-top:10px;" onclick="window.navigateView('viewHome')">BACK TO HOME</button>
        </div>
    </div>

    <!-- VIEW 3: BROADCAST MATCH CENTER (Cricbuzz / Cricinfo Tabs) -->
    <div id="viewBroadcastCenter" class="app-view hidden">
        <div class="top-bar" style="margin-bottom:8px; background:#1e293b;">
            <span id="bcHeaderTitle" style="font-weight:bold; color:var(--blue);">Match Center</span>
            <button class="btn-util" style="background:#0f172a; color:var(--gold); border:none; padding:4px 8px; border-radius:4px; font-size:0.7rem; cursor:pointer;" onclick="window.openLiveHubView()">← All Matches</button>
        </div>

        <!-- BROADCAST NAVIGATION TABS -->
        <div class="broadcast-nav">
            <button class="b-tab active" id="bTabInfo" onclick="window.switchBroadcastTab('info')">INFO</button>
            <button class="b-tab" id="bTabLive" onclick="window.switchBroadcastTab('live')">LIVE</button>
            <button class="b-tab" id="bTabGraphs" onclick="window.switchBroadcastTab('graphs')">GRAPHS</button>
            <button class="b-tab" id="bTabScorecard" onclick="window.switchBroadcastTab('scorecard')">SCORECARD</button>
            <button class="b-tab" id="bTabOvers" onclick="window.switchBroadcastTab('overs')">OVERS</button>
            <button class="b-tab" id="bTabHighlights" onclick="window.switchBroadcastTab('highlights')">HIGHLIGHTS</button>
        </div>

        <!-- TAB CONTENT CONTAINER -->
        <div class="view-card" id="broadcastContentBox" style="min-height:350px;">
            Loading broadcast feed...
        </div>

        <button class="btn" style="background:#334155;" onclick="window.openLiveHubView()">RETURN TO MATCH LIST</button>
    </div>

    <!-- SYNCHRONOUS JAVASCRIPT ENGINE -->
    <script>
        var currentActiveView = 'viewHome';

        window.navigateView = function(viewId, isBack) {
            ['viewHome', 'viewLiveHub', 'viewBroadcastCenter'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
            var target = document.getElementById(viewId);
            if (target) target.classList.remove('hidden');
            currentActiveView = viewId;
        };

        var firebaseConfig = {
            apiKey: "AIzaSyAbjxVu29ub-BKCNm7tMk2nl0ibQHkm7iE",
            authDomain: "cric8-league.firebaseapp.com",
            projectId: "cric8-league",
            appId: "1:623659944427:web:a4ad2da48833e6a4db31ae"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        var activeMatchHubId = 'pitch_1';
        var activeBroadcastTab = 'info';
        var broadcastMatchData = null;
        var broadcastUnsubscribe = null;

        window.openLiveHubView = function() {
            window.navigateView('viewLiveHub');
            window.renderLiveHubMatches();
        };

        window.renderLiveHubMatches = function() {
            var container = document.getElementById('liveHubContainer');
            var filter = document.getElementById('hubTourneyFilter').value;
            var pitches = ['pitch_1', 'pitch_2', 'pitch_3', 'pitch_4'];

            container.innerHTML = '<div style="text-align:center; padding:15px; color:#64748b;">Checking pitches...</div>';

            var loadedCount = 0;
            var html = '';

            pitches.forEach(function(pId) {
                db.collection("matches").doc(pId).get().then(function(snap) {
                    loadedCount++;
                    if (snap.exists) {
                        var d = snap.data();
                        if (filter === 'all' || d.tournament === filter) {
                            var tA = d.tA ? d.tA.name : "Team 1";
                            var tB = d.tB ? d.tB.name : "Team 2";
                            var sA = d.tA ? (d.tA.score + "/" + d.tA.wkts) : "0/0";
                            var sB = d.tB ? (d.tB.score + "/" + d.tB.wkts) : "0/0";
                            var statusTxt = d.match_status === 'completed' ? '<span style="color:var(--gold);">Completed</span>' : '<span style="color:var(--green);">● LIVE</span>';

                            html += '<div class="match-hub-card" onclick="window.openBroadcastMatch(\'' + pId + '\')">' +
                                '<div style="display:flex; justify-content:space-between; font-size:0.72rem; color:#94a3b8; margin-bottom:4px;">' +
                                '<span>' + pId.toUpperCase().replace('_', ' ') + ' (' + (d.rulesFormat || 'pairs').toUpperCase() + ')</span>' +
                                statusTxt + '</div>' +
                                '<div style="font-size:0.95rem; font-weight:bold;">' + tA + ' <span style="color:var(--gold);">' + sA + '</span> vs ' + tB + ' <span style="color:var(--gold);">' + sB + '</span></div>' +
                                '<div style="font-size:0.75rem; color:#38bdf8; margin-top:4px;">Tap to view Match Center &rarr;</div>' +
                                '</div>';
                        }
                    }
                    if (loadedCount === pitches.length) {
                        container.innerHTML = html || '<div style="text-align:center; padding:20px; color:#64748b;">No active matches found.</div>';
                    }
                }).catch(function() {
                    loadedCount++;
                });
            });
        };

        window.openBroadcastMatch = function(pId) {
            activeMatchHubId = pId;
            window.navigateView('viewBroadcastCenter');
            
            if (broadcastUnsubscribe) broadcastUnsubscribe();
            broadcastUnsubscribe = db.collection("matches").doc(pId).onSnapshot(function(snap) {
                if (snap.exists) {
                    broadcastMatchData = snap.data();
                    window.renderBroadcastTabContent();
                }
            });
        };

        window.switchBroadcastTab = function(tabName) {
            activeBroadcastTab = tabName;
            ['info', 'live', 'graphs', 'scorecard', 'overs', 'highlights'].forEach(function(t) {
                var btn = document.getElementById('bTab' + t.charAt(0).toUpperCase() + t.slice(1));
                if (btn) btn.classList.toggle('active', t === tabName);
            });
            window.renderBroadcastTabContent();
        };

        window.renderBroadcastTabContent = function() {
            var box = document.getElementById('broadcastContentBox');
            var d = broadcastMatchData;
            if (!d) {
                box.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">Waiting for data feed...</div>';
                return;
            }

            var tA = d.tA ? d.tA.name : "Team 1";
            var tB = d.tB ? d.tB.name : "Team 2";
            document.getElementById('bcHeaderTitle').innerText = tA + " vs " + tB;

            if (activeBroadcastTab === 'info') {
                box.innerHTML = '<table class="sc-table" style="font-size:0.85rem;">' +
                    '<tr><td style="color:#94a3b8;">Match</td><td><b>' + tA + ' vs ' + tB + '</b></td></tr>' +
                    '<tr><td style="color:#94a3b8;">Series / Event</td><td>' + (d.tournament || 'Corporate Tournament') + '</td></tr>' +
                    '<tr><td style="color:#94a3b8;">Format</td><td>' + (d.rulesFormat === 'pairs' ? 'Custom Cric-8 Pairs' : 'Classic Standard') + '</td></tr>' +
                    '<tr><td style="color:#94a3b8;">Toss</td><td>' + (d.tossWinner ? ((d.tossWinner === 'tA' ? tA : tB) + ' won & elected to ' + d.tossDecision) : 'Toss pending') + '</td></tr>' +
                    '<tr><td style="color:#94a3b8;">Venue</td><td>Cric-8 Arena (' + activeMatchHubId.toUpperCase().replace('_', ' ') + ')</td></tr>' +
                    '</table>';
            } else if (activeBroadcastTab === 'live') {
                var isTeamABatting = (d.tossWinner === 'tA') ? (d.tossDecision === 'bat') : (d.tossDecision === 'bowl');
                if (d.inn === 2) isTeamABatting = !isTeamABatting;
                var batTeam = isTeamABatting ? tA : tB;
                var bowlTeam = isTeamABatting ? tB : tA;
                var sA = d.tA ? (d.tA.score + "/" + d.tA.wkts) : "0/0";
                var sB = d.tB ? (d.tB.score + "/" + d.tB.wkts) : "0/0";

                var mvpHtml = '';
                if (d.match_status === 'completed' && d.mvp) {
                    mvpHtml = '<div style="background:#0f172a; border:1px solid var(--gold); padding:10px; border-radius:8px; margin-bottom:12px; text-align:center;">' +
                        '<div style="font-size:0.75rem; color:var(--gold); font-weight:bold;">PLAYER OF THE MATCH (MVP)</div>' +
                        '<div style="font-size:0.95rem; font-weight:bold; margin-top:4px;">🌟 ' + d.mvp + '</div></div>';
                }

                box.innerHTML = mvpHtml +
                    '<div style="background:#0f172a; padding:12px; border-radius:8px; margin-bottom:12px; text-align:center;">' +
                    '<div style="font-size:1.4rem; font-weight:900; color:var(--blue);">' + tA + ': ' + sA + ' | ' + tB + ': ' + sB + '</div>' +
                    '<div style="font-size:0.8rem; color:#94a3b8; margin-top:4px;">Current Innings: ' + batTeam + ' Batting vs ' + bowlTeam + ' Bowling</div>' +
                    '</div>' +
                    '<div style="font-size:0.85rem; font-weight:bold; color:var(--gold); margin-bottom:6px;">Crease Batters</div>' +
                    '<div style="background:#0b1120; padding:10px; border-radius:6px; font-size:0.82rem; margin-bottom:12px;">' +
                    '<div><b>' + (d.crr_bat_name || 'Striker') + '*</b> : ' + (d.crr_bat_runs || 0) + ' runs (' + (d.crr_bat_balls || 0) + 'b)</div>' +
                    '<div style="margin-top:4px; color:#94a3b8;">' + (d.non_bat_name || 'Non-Striker') + ' : ' + (d.non_bat_runs || 0) + ' runs (' + (d.non_bat_balls || 0) + 'b)</div>' +
                    '</div>' +
                    '<div style="font-size:0.85rem; font-weight:bold; color:var(--blue); margin-bottom:6px;">Current Bowler</div>' +
                    '<div style="background:#0b1120; padding:10px; border-radius:6px; font-size:0.82rem;">' +
                    '<b>' + (d.crr_bowl || 'TBD') + '</b>' +
                    '</div>';
            } else if (activeBroadcastTab === 'graphs') {
                var timeline = Array.isArray(d.ball_timeline) ? d.ball_timeline : [];
                box.innerHTML = '<div style="font-size:0.85rem; font-weight:bold; color:var(--blue); margin-bottom:8px;">OVERS RUNS COMPARISON</div>';
                if (timeline.length === 0) {
                    box.innerHTML += '<div style="color:#64748b; text-align:center; padding:20px;">No ball data available for graph yet.</div>';
                    return;
                }
                var overRuns = {};
                timeline.forEach(function(ev) {
                    if (!overRuns[ev.over]) overRuns[ev.over] = 0;
                    var r = parseInt(ev.event) || 0;
                    overRuns[ev.over] += r;
                });
                for (var ov in overRuns) {
                    box.innerHTML += '<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #1e293b; font-size:0.82rem;">' +
                        '<span>Over ' + ov + '</span>' +
                        '<span style="color:var(--gold); font-weight:bold;">' + overRuns[ov] + ' runs</span></div>';
                }
            } else if (activeBroadcastTab === 'scorecard') {
                var sc = d.inn1_scorecard || { batters: {}, bowlers: {} };
                box.innerHTML = '<div style="font-size:0.85rem; font-weight:bold; color:var(--gold); margin-bottom:6px;">Innings 1 Scorecard</div>' +
                    '<table class="sc-table"><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr>';
                for (var b in sc.batters) {
                    var st = sc.batters[b];
                    box.innerHTML += '<tr><td><b>' + b + '</b></td><td>' + st.runs + '</td><td>' + st.balls + '</td><td>' + st.fours + '</td><td>' + st.sixes + '</td></tr>';
                }
                box.innerHTML += '</table>';
            } else if (activeBroadcastTab === 'overs') {
                var timelineOvers = Array.isArray(d.ball_timeline) ? d.ball_timeline : [];
                var grouped = {};
                timelineOvers.forEach(function(ev) {
                    if (!grouped[ev.over]) grouped[ev.over] = [];
                    grouped[ev.over].push(ev);
                });
                var oHtml = '';
                for (var oNo in grouped) {
                    oHtml += '<div style="background:#0b1120; padding:8px; border-radius:6px; margin-bottom:8px;">' +
                        '<div style="font-size:0.78rem; color:var(--blue); font-weight:bold; margin-bottom:4px;">Over ' + oNo + ' (Bowler: ' + (grouped[oNo][0]?.bowler || '') + ')</div>' +
                        '<div style="display:flex; gap:4px; flex-wrap:wrap;">';
                    grouped[oNo].forEach(function(b) {
                        var cls = '';
                        if (b.event.toString().includes('4')) cls = 'four';
                        else if (b.event.toString().includes('6')) cls = 'six';
                        else if (b.event.toString().includes('W')) cls = 'wkt';
                        oHtml += '<div class="ball-pill ' + cls + '">' + b.event + '</div>';
                    });
                    oHtml += '</div></div>';
                }
                box.innerHTML = oHtml || '<div style="text-align:center; color:#64748b; padding:15px;">No completed overs recorded.</div>';
            } else if (activeBroadcastTab === 'highlights') {
                var timelineH = Array.isArray(d.ball_timeline) ? d.ball_timeline : [];
                var highlights = timelineH.filter(function(ev) {
                    var evStr = ev.event.toString();
                    return evStr.includes('4') || evStr.includes('6') || evStr.includes('W') || evStr.includes('3D');
                });
                var hHtml = '<div style="font-size:0.85rem; font-weight:bold; color:var(--gold); margin-bottom:8px;">Match Highlights (Boundaries & Wickets)</div>';
                highlights.reverse().forEach(function(h) {
                    hHtml += '<div style="background:#0b1120; padding:8px; border-radius:6px; margin-bottom:6px; font-size:0.8rem;">' +
                        '<span style="color:var(--blue); font-weight:bold;">Over ' + h.over + '.' + h.ball + '</span>: ' +
                        '<b>' + h.striker + '</b> scored <b style="color:var(--green);">' + h.event + '</b> off <b>' + h.bowler + '</b>' +
                        '</div>';
                });
                box.innerHTML = hHtml || '<div style="text-align:center; color:#64748b; padding:15px;">No major highlights recorded yet.</div>';
            }
        };
    </script>
</body>
</html>
